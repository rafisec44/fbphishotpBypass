<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Your Account</title>


<style>


*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;

}



body{

    background:#ffffff;

}



.container{

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

}



.logo{

    margin-top:45px;

}



.logo img{

    width:70px;

}




.box{


    width:90%;

    max-width:360px;

    margin-top:55px;


}




.box h2{


    font-size:24px;

    font-weight:600;

    margin-bottom:15px;


}




.box p{


    color:#666;

    font-size:16px;

    margin-bottom:25px;

    line-height:22px;


}





.input-box{


    margin-bottom:22px;


}




.input-box input{


    width:100%;

    height:58px;


    border:1px solid #ccd0d5;


    border-radius:16px;


    padding:0 18px;


    font-size:18px;


    outline:none;


}




.input-box input:focus{


    border:2px solid #1877f2;


}




.search-btn{


    width:100%;

    height:54px;


    border:none;


    border-radius:30px;


    background:#1877f2;


    color:#fff;


    font-size:20px;


    font-weight:bold;


    cursor:pointer;


}




.search-btn:hover{


    background:#166fe5;


}




.back{


    margin-top:25px;

    text-align:center;


}




.back a{


    color:#1877f2;


    text-decoration:none;


    font-size:17px;


}


</style>


</head>




<body>



<div class="container">



<div class="logo">


<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">


</div>





<div class="box">



<h2>

Find your account

</h2>





<p>

Enter your mobile number or email to search for your account.

</p>





<form action="/search" method="POST">





<div class="input-box">


<input

type="text"

name="account"

placeholder="Mobile number or email"

required>


</div>






<button class="search-btn" type="submit">


Search


</button>





</form>






<div class="back">


<a href="/">


← Back to Login


</a>


</div>





</div>



</div>



</body>


</html>
